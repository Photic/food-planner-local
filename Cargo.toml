[package]
name = "food-planner"
version = "0.1.0"
authors = ["Steen Rene Hansen <steen_home@hotmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "wasmbind"] }

# Photo bytes cross the wire as base64 inside JSON. Needed on both sides: the
# browser encodes what it read from the file input, the server decodes it before
# it reaches SQLite.
base64 = "0.22"

# Server-only dependencies. The `server` feature gates them so the wasm client
# build never tries to compile a database driver.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
], optional = true }
tokio = { version = "1", features = ["sync"], optional = true }

# Browser APIs behind the in-app viewfinder. Gated on the target rather than on
# a cargo feature, so the camera modules are decided by where the code runs
# rather than by which features a build happens to name. web-sys reaches the
# native build anyway through gloo-net, but only with that crate's features:
# nothing here asks the server to compile bindings for a DOM it does not have.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "Document",
    "DomException",
    "Element",
    "HtmlCanvasElement",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "Navigator",
    "Window",
] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:sqlx", "dep:tokio"]
