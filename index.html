<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{app_title}</title>
    <meta charset="UTF-8" />
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <!-- viewport-fit=cover so the layout can pad around the notch on a phone -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6f4e" />

    <link rel="manifest" href="/manifest.json" />

    <!-- iOS ignores the manifest for home-screen installs and reads these instead -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Food Planner" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <script>
      // Everything in public/ is served from the web root, so the worker sits at
      // /sw.js and gets the whole origin as its scope by default. Registration
      // is a no-op over plain HTTP to a LAN address: browsers only expose
      // serviceWorker in a secure context, which localhost and HTTPS satisfy.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function (err) {
            console.warn("Service worker registration failed:", err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
